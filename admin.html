<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 | 예겜</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div id="app-container" class="min-h-screen flex flex-col">

        <!-- Header -->
        <header class="bg-white/90 backdrop-blur-sm sticky top-0 z-50 border-b border-gray-200">
            <nav class="container mx-auto px-4 lg:px-8 py-3 flex justify-between items-center">
                <a href="index.html" class="flex items-center space-x-3">
                    <img src="https://r2.flowith.net/files/o/1750058729786-poliview_logo_design_for_political_social_issues_platform_index_0@1024x1024.png" alt="예겜 Logo" class="h-8 w-auto">
                    <span class="text-xl font-bold tracking-tight text-gray-900">예겜</span>
                </a>
                <div class="hidden md:flex items-center space-x-6 text-sm font-medium text-gray-600">
                    <a href="index.html" class="hover:text-gray-900 transition-colors">홈</a>
                    <a href="issues.html" class="hover:text-gray-900 transition-colors">이슈 목록</a>
                    <a href="mypage.html" class="hover:text-gray-900 transition-colors">내 정보</a>
                    <a href="admin.html" class="text-red-600 font-semibold">관리자</a>
                </div>
                <div id="header-user-actions" class="flex items-center space-x-4">
                    <!-- This will be dynamically populated by js/app.js -->
                </div>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-4 lg:px-8 py-12">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-2xl md:text-3xl lg:text-4xl font-bold text-gray-900 mb-2">관리자 페이지</h1>
                    <p class="text-sm md:text-base text-gray-600">이슈를 생성하고 관리할 수 있습니다.</p>
                </div>
                <button id="create-issue-btn" class="btn-primary w-full sm:w-auto whitespace-nowrap flex items-center justify-center">
                    <i data-lucide="plus" class="w-4 h-4 mr-2"></i>
                    새 이슈 생성
                </button>
            </div>

            <!-- 새 이슈 생성 폼 -->
            <div id="create-issue-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 md:flex md:items-center md:justify-center">
                <div class="bg-white md:rounded-lg max-w-2xl w-full h-full md:h-auto md:max-h-[90vh] overflow-y-auto">
                    <div class="sticky top-0 bg-white p-4 md:p-6 border-b border-gray-200 z-10">
                        <div class="flex items-center justify-between">
                            <h2 class="text-lg md:text-xl font-bold text-gray-900">새 이슈 생성</h2>
                            <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600 p-2 -mr-2">
                                <i data-lucide="x" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>
                    <form id="create-issue-form" class="p-4 md:p-6 space-y-6">
                        <div>
                            <label for="issue-title" class="block text-sm font-medium text-gray-700 mb-2">이슈 제목</label>
                            <input type="text" id="issue-title" name="title" class="modern-input w-full" placeholder="예: 비트코인, 2025년 내 20만 달러 돌파할까?" required>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-3">카테고리</label>
                            <input type="hidden" id="issue-category" name="category" required>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                <button type="button" class="category-btn py-3 px-4 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-category="정치">
                                    <div class="text-xl mb-1">🏛️</div>
                                    정치
                                </button>
                                <button type="button" class="category-btn py-3 px-4 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-category="스포츠">
                                    <div class="text-xl mb-1">⚽</div>
                                    스포츠
                                </button>
                                <button type="button" class="category-btn py-3 px-4 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-category="경제">
                                    <div class="text-xl mb-1">💰</div>
                                    경제
                                </button>
                                <button type="button" class="category-btn py-3 px-4 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-category="코인">
                                    <div class="text-xl mb-1">₿</div>
                                    코인
                                </button>
                                <button type="button" class="category-btn py-3 px-4 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-category="테크">
                                    <div class="text-xl mb-1">💻</div>
                                    테크
                                </button>
                                <button type="button" class="category-btn py-3 px-4 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-category="엔터">
                                    <div class="text-xl mb-1">🎬</div>
                                    엔터
                                </button>
                                <button type="button" class="category-btn py-3 px-4 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-category="날씨">
                                    <div class="text-xl mb-1">🌤️</div>
                                    날씨
                                </button>
                                <button type="button" class="category-btn py-3 px-4 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-category="해외">
                                    <div class="text-xl mb-1">🌍</div>
                                    해외
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">마감일</label>
                            <div class="grid grid-cols-3 gap-2 mb-3">
                                <button type="button" class="quick-date-btn py-2 px-3 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-days="1">
                                    1일 후
                                </button>
                                <button type="button" class="quick-date-btn py-2 px-3 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-days="7">
                                    7일 후
                                </button>
                                <button type="button" class="quick-date-btn py-2 px-3 rounded-lg border-2 border-gray-200 hover:border-blue-500 transition-all text-sm font-medium text-gray-700 hover:text-blue-600 hover:bg-blue-50" data-days="30">
                                    30일 후
                                </button>
                            </div>
                            <input type="datetime-local" id="issue-end-date" name="endDate" class="modern-input w-full" required>
                        </div>

                        <div>
                            <label for="issue-yes-price" class="block text-sm font-medium text-gray-700 mb-2">
                                초기 Yes 확률: <span id="yes-price-display" class="text-blue-600 font-semibold">50%</span>
                            </label>
                            <input type="range" id="issue-yes-price" name="yesPrice" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600" min="1" max="99" value="50" required>
                            <div class="flex justify-between text-xs text-gray-500 mt-1">
                                <span>1%</span>
                                <span>50%</span>
                                <span>99%</span>
                            </div>
                        </div>

                        <div class="flex items-center bg-blue-50 p-3 rounded-lg">
                            <input type="checkbox" id="issue-popular" name="isPopular" class="mr-3 w-5 h-5 text-blue-600 rounded">
                            <label for="issue-popular" class="text-sm font-medium text-gray-700">인기 이슈로 표시</label>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-3 pt-4 sticky bottom-0 bg-white pb-4 md:pb-0">
                            <button type="submit" class="btn-primary flex-1 py-3 text-base font-semibold">이슈 생성</button>
                            <button type="button" id="cancel-btn" class="sm:w-auto px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium">취소</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 이슈 관리 -->
            <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                <div class="px-4 md:px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900">이슈 관리</h3>
                </div>

                <!-- 데스크톱: 테이블 뷰 -->
                <div class="hidden lg:block overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">이슈</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">카테고리</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Yes 확률</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">참여량</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">상태</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">액션</th>
                            </tr>
                        </thead>
                        <tbody id="issues-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- 이슈 목록이 여기에 동적으로 생성됩니다 -->
                        </tbody>
                    </table>
                </div>

                <!-- 모바일/태블릿: 카드 뷰 -->
                <div id="issues-card-body" class="lg:hidden divide-y divide-gray-200">
                    <!-- 이슈 카드가 여기에 동적으로 생성됩니다 -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-50 border-t border-gray-200">
            <div class="container mx-auto px-4 lg:px-8 py-8">
                <div class="flex flex-col md:flex-row justify-between items-center text-center md:text-left space-y-4 md:space-y-0">
                    <div>
                        <a href="index.html" class="flex items-center justify-center md:justify-start space-x-2 mb-2">
                             <img src="https://r2.flowith.net/files/o/1750058729786-poliview_logo_design_for_political_social_issues_platform_index_0@1024x1024.png" alt="예겜 Logo" class="h-6 w-auto">
                             <span class="font-semibold text-gray-900">예겜</span>
                        </a>
                        <p class="text-xs text-gray-500 max-w-md">본 서비스는 현금 베팅을 제공하지 않는 예측 정보 플랫폼이며, 사용되는 감코인은 환전 및 현금화가 불가능한 사이버 자산입니다.</p>
                    </div>
                    <div class="flex space-x-6 text-sm text-gray-500">
                        <a href="#" class="hover:text-gray-900 transition-colors">사이트 정보</a>
                        <a href="#" class="hover:text-gray-900 transition-colors">이용약관</a>
                        <a href="#" class="hover:text-gray-900 transition-colors">개인정보처리방침</a>
                    </div>
                </div>
                <div class="mt-8 border-t border-gray-200 pt-4 text-center text-xs text-gray-500">
                    &copy; 2025 예겜. All Rights Reserved.
                </div>
            </div>
        </footer>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
